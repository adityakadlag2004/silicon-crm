org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=false

# ── App configuration (single source of truth) ────────────────────────
# The production host the TWA is bound to. Changing this requires a new
# assetlinks.json deployment on that host.
twaHostName=bo.kadlaginvestment.com
# The URL opened when the app launches.
twaLaunchPath=/clients/login/
twaAppName=Kadlag Inv BO
twaAppNameFull=Kadlag Investment BO
twaApplicationId=bo.kadlaginvestment.crm
# Bump versionCode by 1 for every Play Store upload; versionName is display-only.
twaVersionCode=1
twaVersionName=1.0.0
# Brand colors (match static/manifest.json)
twaThemeColor=#E5B740
twaBackgroundColor=#FFFEF8
