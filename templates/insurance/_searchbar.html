{# Search + count bar shared by the three list screens. Expects `q`, `count`, `noun`. #}
<form method="get" class="ki-showbar">
  <input type="search" name="q" value="{{ q }}" class="form-control form-control-sm"
         style="max-width:300px;" placeholder="Search {{ noun }}…">
  <button class="ki-btn ki-btn-primary ki-btn-sm" type="submit"><i class="bi bi-search"></i> Search</button>
  {% if q %}<a class="ki-btn ki-btn-secondary ki-btn-sm" href="?">Reset</a>{% endif %}
  <span class="right">{{ count }} {{ noun }}{{ count|pluralize }}</span>
</form>
