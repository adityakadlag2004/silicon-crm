{# Add / edit link modal. JS retargets the form action for edits. Expects `categories`. #}
<div class="modal fade" id="linkModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{% url 'clients:link_create' %}" id="linkForm">
        {% csrf_token %}
        <div class="ki-modal-header modal-header">
          <h5 class="modal-title" id="linkModalTitle"><i class="bi bi-link-45deg"></i> Add Link</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Title</label>
            <input type="text" name="title" id="linkTitle" class="form-control" required maxlength="200" aria-label="Title"></div>
          <div class="mb-3"><label class="form-label">URL</label>
            <input type="text" name="url" id="linkUrl" class="form-control" required placeholder="https://…" maxlength="500"></div>
          <div class="mb-3"><label class="form-label">Description</label>
            <input type="text" name="description" id="linkDesc" class="form-control" maxlength="255" aria-label="Description"></div>
          <div class="row g-3">
            <div class="col-md-7"><label class="form-label">Category</label>
              <select name="category" id="linkCat" class="form-select" data-create-url="{% url 'clients:link_category_create' %}" aria-label="Category">
                <option value="">— Uncategorized —</option>
                {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                <option value="__add__">＋ Add category…</option>
              </select>
              <div id="lkCatAdd" style="display:none;margin-top:.5rem;">
                <div style="display:flex;gap:.4rem;align-items:center;">
                  <input type="text" id="lkNewCatName" class="form-control form-control-sm" placeholder="New category name" style="flex:1;">
                  <input type="color" id="lkNewCatColor" class="form-control form-control-sm form-control-color" value="#2563eb" title="Color">
                  <button type="button" class="ki-btn ki-btn-primary ki-btn-sm" id="lkNewCatSave">Create</button>
                  <button type="button" class="ki-btn ki-btn-secondary ki-btn-sm" id="lkNewCatCancel">Cancel</button>
                </div>
              </div></div>
            <div class="col-md-5"><label class="form-label">Icon (optional)</label>
              <input type="text" name="icon" id="linkIcon" class="form-control" placeholder="bi-globe"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="ki-btn ki-btn-secondary ki-btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="ki-btn ki-btn-primary ki-btn-sm"><i class="bi bi-check-lg"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
