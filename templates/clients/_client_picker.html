{% comment %}
  Search-box client picker for a form whose `client` field is a HiddenInput —
  never a <select> of the whole book. Expects `field` (the bound client field)
  and `picked` (the Client already chosen, or None).
{% endcomment %}
<div class="col-12 position-relative">
  <label class="form-label fw-semibold" for="cp-search">Client <span class="text-danger">*</span></label>
  {{ field }}
  <div id="cp-picked" style="display:flex;align-items:center;gap:.5rem;" {% if not picked %}hidden{% endif %}>
    <span class="ki-tag" style="--c:#4338CA;"><i class="bi bi-person-check"></i> <span id="cp-picked-name">{{ picked.name }}</span></span>
    <button type="button" id="cp-change" class="ki-btn ki-btn-secondary ki-btn-sm">Change</button>
  </div>
  <input type="search" id="cp-search" class="form-control" autocomplete="off"
         placeholder="Type the client's name, phone or email…" {% if picked %}hidden{% endif %}>
  <div id="cp-results" class="list-group position-absolute shadow-sm"
       style="z-index:1000;max-height:240px;overflow-y:auto;left:.75rem;right:.75rem;"></div>
  {% if field.errors %}<div class="text-danger small mt-1">Pick the client.</div>{% endif %}
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const idField = document.getElementById("{{ field.id_for_label }}");
  const search = document.getElementById("cp-search");
  const results = document.getElementById("cp-results");
  const picked = document.getElementById("cp-picked");
  const pickedName = document.getElementById("cp-picked-name");
  let timer;
  search.addEventListener("input", function () {
    clearTimeout(timer);
    const q = search.value.trim();
    if (q.length < 2) { results.innerHTML = ""; return; }
    timer = setTimeout(function () {
      fetch("{% url 'clients:search_clients' %}?q=" + encodeURIComponent(q))
        .then(r => r.json())
        .then(function (data) {
          results.innerHTML = "";
          (data.results || []).forEach(function (c) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "list-group-item list-group-item-action py-2";
            b.textContent = c.text;
            b.onclick = function () {
              idField.value = c.id;
              pickedName.textContent = c.text;
              picked.hidden = false;
              search.hidden = true;
              results.innerHTML = "";
            };
            results.appendChild(b);
          });
          if (!results.children.length) {
            results.innerHTML = '<div class="list-group-item text-muted py-2">No matching client</div>';
          }
        });
    }, 250);
  });
  document.getElementById("cp-change").addEventListener("click", function () {
    idField.value = "";
    picked.hidden = true;
    search.hidden = false;
    search.value = "";
    search.focus();
  });
});
</script>
